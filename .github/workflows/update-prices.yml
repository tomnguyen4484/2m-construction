name: Update Home Depot Material Prices

on:
  schedule:
    - cron: '0 6 1 */3 *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run price scraper
        run: node scripts/scrape-hd-prices.mjs
        continue-on-error: true
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

      - name: Check for price changes
        id: check_changes
        run: |
          git diff --quiet data/hd-prices.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated prices
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "Price Bot"
          git config user.email "bot@2mhuntsville.com"
          git add data/hd-prices.json
          git commit -m "chore: update Home Depot material prices (quarterly)"
          git push
